name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend build + unit tests
    runs-on: ubuntu-latest
    services:
      video-operations-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: video_test
          POSTGRES_PASSWORD: video_ci_only
          POSTGRES_DB: video_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_test -d video_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Resolve modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests including video and upstream regressions
        run: go test -tags=unit ./... -count=1

      - name: Database integration tests
        env:
          VIDEO_OPERATIONS_TEST_DSN: postgres://video_test:video_ci_only@127.0.0.1:5432/video_test?sslmode=disable
        run: go test -tags=integration ./... -count=1

  frontend:
    name: frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm run test:run
      - run: pnpm run build
