name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Resolve modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Video and gateway regression tests
        run: |
          go test ./internal/pkg/... -count=1
          go test -tags=unit ./internal/service/ ./internal/handler/ ./internal/handler/admin/ ./internal/server/routes/ -count=1 -run 'Video|Seedance|Minimax|Billing|CodexPageContext|CodexSelectedPage|CyberSession|CyberTranscript|FindCyberSession|GPTImage26|GPTImage25And26|OpenAIImagesComplexity'
          go test -tags=unit ./internal/repository/ -count=1 -run 'GroupVideoBilling|SchedulerCacheSnapshotPreservesExplicitVideoCapabilities|GatewayCacheCyber|HTTPUpstreamVideo'
